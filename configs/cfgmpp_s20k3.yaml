# CFG-MP+ (AA(1,1)) with 20 sampling steps and the demo iteration count K=3 (the paper itself recommends FPI=2) -> 124 NFE. Not budget matched.
# Purpose: isolate the sampling-step count. Differs from configs/cfgmpp.yaml (10 steps, K=3, 62 NFE) only in
# num_inference_steps. AA is active on iterations 2 and 3 of each projected step, as in the demo defaults.
generation_params:
  method: cfgmpp
  num_inference_steps: 20
  guidance_scale: 4.0
  max_aa_iter: 3
  aa_window_size: 1
  aa_damping: 1.0
  time_threshold: 0.6
